<body>
  <div class="container">

    <aside class="sidebar">
      <h2>Upload PDFs</h2>

      <input type="file" id="pdfInput" multiple />

      <button id="uploadBtn">
        Upload
      </button>
    </aside>

    <main class="chat-container">

      <div id="chatBox"></div>

      <div class="input-area">
        <input
          type="text"
          id="questionInput"
          placeholder="Ask medical question..."
        />

        <button id="sendBtn">
          Send
        </button>
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
